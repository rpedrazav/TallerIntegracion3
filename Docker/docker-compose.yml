# ==============================================================================
# Docker Compose — Infraestructura Local GlobalMart OS
# Proyecto: Taller de Integración 3 (INTEGRA3)
#
# Servicios:
#   - 8x PostgreSQL 16 (una instancia por microservicio)
#   - Apache Zookeeper + Apache Kafka + Kafka Init Topics
#   - Kafdrop (UI web de Kafka)
#   - Kong 3.6 DB-less (API Gateway)
#   - Prometheus + Grafana (Monitoreo)
#   - Frontend Electron (build helper)
#
# Uso:
#   docker compose up -d          # Levantar todo
#   docker compose ps             # Verificar estado
#   docker compose down           # Detener (mantiene datos)
#   docker compose down -v        # Detener y borrar datos
# ==============================================================================

# --- Configuración Base Reutilizable ---
x-postgres-common: &postgres-common
  image: postgres:16-alpine
  restart: unless-stopped
  mem_limit: 256m
  cpus: 0.5
  networks:
    - minimarket-net
  healthcheck:
    test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d $$POSTGRES_DB" ]
    interval: 10s
    timeout: 5s
    retries: 5

services:
  # --- Frontend Electron ---
  # Usado para instalar deps y correr lint/build SIN necesitar Node en el host.
  # La ventana gráfica (npm start) se corre desde el host directamente.
  # Uso:
  #   docker compose run --rm frontend npm install <paquete>
  #   docker compose run --rm frontend npm run lint
  frontend:
    build:
      context: ../globalmart-frontend
    container_name: globalmart-frontend
    volumes:
      # Monta el código fuente para que los cambios se reflejen en tiempo real
      - ../globalmart-frontend:/app
      # Volumen anónimo para que node_modules del contenedor no pise el del host
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - minimarket-net

  # ==========================================================================
  # BASES DE DATOS — PostgreSQL 16 (8 instancias, una por microservicio)
  # ==========================================================================

  # 1. Tenant & Identity Service
  postgres-tenant:
    <<: *postgres-common
    container_name: postgres-tenant
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: tenant_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata-tenant:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro

  # 2. Supply Chain & Import Service
  postgres-supply:
    <<: *postgres-common
    container_name: postgres-supply
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: supply_db
    ports:
      - "5434:5432"
    volumes:
      - pgdata-supply:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro

  # 3. Catalog & Pricing Service
  postgres-catalog:
    <<: *postgres-common
    container_name: postgres-catalog
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: catalog_db
    ports:
      - "5435:5432"
    volumes:
      - pgdata-catalog:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro

  # 4. POS & Cart Service
  postgres-pos:
    <<: *postgres-common
    container_name: postgres-pos
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: pos_db
    ports:
      - "5436:5432"
    volumes:
      - pgdata-pos:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro

  # 5. Tax & Compliance Service
  postgres-tax:
    <<: *postgres-common
    container_name: postgres-tax
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: tax_db
    ports:
      - "5437:5432"
    volumes:
      - pgdata-tax:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro

  # 6. Warehouse & Inventory Service
  postgres-warehouse:
    <<: *postgres-common
    container_name: postgres-warehouse
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: warehouse_db
    ports:
      - "5438:5432"
    volumes:
      - pgdata-warehouse:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro

  # 7. Analytics & Notification Service
  postgres-analytics:
    <<: *postgres-common
    container_name: postgres-analytics
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: analytics_db
    ports:
      - "5439:5432"
    volumes:
      - pgdata-analytics:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro

  # 8. Loyalty & Customer Service
  postgres-loyalty:
    <<: *postgres-common
    container_name: postgres-loyalty
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: loyalty_db
    ports:
      - "5440:5432"
    volumes:
      - pgdata-loyalty:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro

  # ==========================================================================
  # MENSAJERÍA — Apache Kafka + Zookeeper
  # ==========================================================================

  # --- 9. Apache Zookeeper (Coordinación de Kafka) ---
  zookeeper:
    image: ${ZOOKEEPER_IMAGE:-confluentinc/cp-zookeeper:7.6.1}
    container_name: zookeeper
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_PORT:-2181}
      ZOOKEEPER_TICK_TIME: ${ZOOKEEPER_TICK_TIME:-2000}
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      KAFKA_HEAP_OPTS: ${ZOOKEEPER_HEAP_OPTS:--Xmx256m -Xms128m}
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=*"
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    volumes:
      - zkdata:/var/lib/zookeeper/data
      - zklog:/var/lib/zookeeper/log
    networks:
      - minimarket-net
    healthcheck:
      test: [ "CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- 10. Apache Kafka Broker (Bus de Eventos Asíncrono) ---
  kafka:
    image: ${KAFKA_IMAGE:-confluentinc/cp-kafka:7.6.1}
    container_name: kafka
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:${ZOOKEEPER_PORT:-2181}
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:${KAFKA_INTERNAL_PORT:-29092},PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:${KAFKA_INTERNAL_PORT:-29092},PLAINTEXT_HOST://${KAFKA_HOST:-localhost}:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xmx512m -Xms256m}
    volumes:
      - kafkadata:/var/lib/kafka/data
    networks:
      - minimarket-net
    healthcheck:
      test: [ "CMD-SHELL", "cub kafka-ready 1 10 -b localhost:9092 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s

  # --- 11. Kafka Topics Initializer (Aprovisionamiento de Topics) ---
  kafka-init-topics:
    image: ${KAFKA_IMAGE:-confluentinc/cp-kafka:7.6.1}
    container_name: kafka-init-topics
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - minimarket-net
    environment:
      KAFKA_BROKER: kafka:${KAFKA_INTERNAL_PORT:-29092}
      KAFKA_INIT_TOPICS: ${KAFKA_INIT_TOPICS:-sale.completed,stock.alert,expiry.alert,sale.reversed,stock.updated,purchase.received,fx.rate.updated,points.updated,tenant.created,tenant.updated,user.registered,product.created,product.price_updated,shift.closed,stock.low,product.expiring_soon,purchase_order.received}
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-1}
      KAFKA_TOPIC_REPLICATION_FACTOR: ${KAFKA_TOPIC_REPLICATION_FACTOR:-1}
    entrypoint:
      - /bin/bash
      - -c
      - |
        echo "============================================================"
        echo " [Kafka Init] Conectando con broker en $$KAFKA_BROKER..."
        cub kafka-ready 1 30 -b $$KAFKA_BROKER

        echo " [Kafka Init] Broker operativo. Aprovisionando topics iniciales..."
        IFS="," read -ra TOPICS <<< "$$KAFKA_INIT_TOPICS"
        for topic in "$${TOPICS[@]}"; do
          clean_topic=$$(echo "$$topic" | tr -d "[:space:]")
          if [ -n "$$clean_topic" ]; then
            echo " [Kafka Init] Aprovisionando topic: [$$clean_topic]..."
            kafka-topics --bootstrap-server $$KAFKA_BROKER \
              --create --if-not-exists \
              --topic "$$clean_topic" \
              --partitions $$KAFKA_TOPIC_PARTITIONS \
              --replication-factor $$KAFKA_TOPIC_REPLICATION_FACTOR
          fi
        done

        echo "============================================================"
        echo " [Kafka Init] Listado oficial de topics en el cluster:"
        kafka-topics --bootstrap-server $$KAFKA_BROKER --list
        echo "============================================================"
        echo " [Kafka Init] Aprovisionamiento de topics finalizado exitosamente."

  # ==========================================================================
  # KAFKA UI — Kafdrop (TI3-113)
  # ==========================================================================

  # --- 12. Kafdrop (UI Web para Apache Kafka) ---
  kafdrop:
    image: obsidiandynamics/kafdrop:4.0.2
    container_name: kafdrop
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFDROP_PORT:-9000}:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:${KAFKA_INTERNAL_PORT:-29092}
      JVM_OPTS: "-Xms128m -Xmx256m"
      SERVER_SERVLET_CONTEXTPATH: "/"
    networks:
      - minimarket-net

  # ==========================================================================
  # API GATEWAY — Kong 3.6 DB-less (TI3-113)
  # ==========================================================================

  # --- 13. Kong API Gateway (Modo Declarativo DB-less) ---
  kong:
    image: kong:3.6
    container_name: kong
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yaml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_ADMIN_GUI_LISTEN: "0.0.0.0:8002"
      KONG_LOG_LEVEL: info
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    ports:
      - "${KONG_PROXY_PORT:-8000}:8000"   # Proxy (tráfico de la app)
      - "${KONG_ADMIN_PORT:-8001}:8001"   # Admin API
      - "8002:8002"                        # Kong Manager GUI
    volumes:
      - ./config/kong.yaml:/etc/kong/kong.yaml:ro
    networks:
      - minimarket-net
    healthcheck:
      test: [ "CMD", "kong", "health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ==========================================================================
  # MONITOREO — Prometheus + Grafana (TI3-114)
  # ==========================================================================

  # --- 14. Prometheus (Recolección de Métricas) ---
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    networks:
      - minimarket-net
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- 15. Grafana (Dashboards y Visualización) ---
  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:${GRAFANA_PORT:-3000}"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - minimarket-net

# ==============================================================================
# Redes y Volúmenes Definidos en Arquitectura
# ==============================================================================
networks:
  minimarket-net:
    driver: bridge

volumes:
  # --- Bases de Datos PostgreSQL ---
  pgdata-tenant:
  pgdata-supply:
  pgdata-catalog:
  pgdata-pos:
  pgdata-tax:
  pgdata-warehouse:
  pgdata-analytics:
  pgdata-loyalty:
  # --- Kafka & Zookeeper ---
  zkdata:
  zklog:
  kafkadata:
  # --- Monitoreo ---
  prometheus-data:
  grafana-data: