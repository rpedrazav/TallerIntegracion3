# ==============================================================================
# Configuración Declarativa de Kong API Gateway (DB-less Mode)
# Proyecto: GlobalMart OS (INTEGRA3)
# Tarea: TI3-113
#
# Este archivo define todas las rutas, servicios y plugins de Kong.
# Kong lo carga al arrancar via KONG_DECLARATIVE_CONFIG.
#
# Documentación: https://docs.konghq.com/gateway/3.6.x/production/deployment-topologies/db-less-and-declarative-config/
# ==============================================================================

_format_version: "3.0"
_transform: true

# ==============================================================================
# Servicios y Rutas — Sprint 1
# ==============================================================================
# NOTA: Los hosts (tenant-identity-service, etc.) corresponden a los nombres
# de servicio Docker que se agregarán cuando se containerizen los microservicios.
# Por ahora están preparados para la integración futura.
# ==============================================================================

services:

  # --------------------------------------------------------------------------
  # MS-1: Tenant & Identity Service (puerto interno 8080)
  # --------------------------------------------------------------------------
  - name: tenant-identity-service
    url: http://ms1:8080
    routes:
      # Ruta pública: SOLO login. Sin autenticación (sin plugin jwt).
      # Se separa de auth-me porque Kong aplica plugins a nivel de ruta completa:
      # si login y /me compartieran ruta, no se podría excluir login del
      # plugin jwt sin excluir también /me.
      - name: auth-login
        paths:
          - /api/auth/login
        strip_path: false
        methods:
          - POST
        plugins:
          # Cumple RN del informe: máx. 10 req/min en login (más estricto
          # que el rate-limiting global de 100/min que ya cubre todo lo demás)
          - name: rate-limiting
            config:
              minute: 10
              policy: local

      # Ruta protegida: GET /api/auth/me requiere JWT válido.
      - name: auth-me
        paths:
          - /api/auth/me
        strip_path: false
        methods:
          - GET
        plugins:
          - name: jwt

      - name: users-route
        paths:
          - /api/users
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        plugins:
          - name: jwt

      - name: tenants-route
        paths:
          - /api/tenants
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        plugins:
          - name: jwt

  # --------------------------------------------------------------------------
  # MS-3: Catalog & Pricing Service (puerto interno 8080)
  # --------------------------------------------------------------------------
  - name: catalog-pricing-service
    url: http://ms3:8080
    routes:
      # GET /api/products    — listar productos (con JWT)
      # POST /api/products   — crear producto (con JWT)
      - name: products-collection-route
        paths:
          - /api/products
        strip_path: false
        methods:
          - GET
          - POST
        plugins:
          - name: jwt

      # GET /api/products/{id}   — obtener producto por ID (con JWT)
      # PUT /api/products/{id}   — actualizar producto por ID (con JWT)
      - name: products-item-route
        paths:
          - ~/api/products/[^/]+$
        strip_path: false
        methods:
          - GET
          - PUT
        plugins:
          - name: jwt

  # --------------------------------------------------------------------------
  # MS-5: POS & Cart Service (puerto interno 8080)
  # --------------------------------------------------------------------------
  - name: pos-cart-service
    url: http://ms5:8080
    routes:
      # POST /api/turnos/abrir   — abrir turno de caja (con JWT)
      # POST /api/turnos/cerrar  — cerrar turno de caja (con JWT)
      # GET  /api/turnos/activo  — obtener turno activo (con JWT)
      # El prefijo /api/turnos captura todos los sub-paths anteriores.
      - name: turnos-route
        paths:
          - /api/turnos
        strip_path: false
        methods:
          - GET
          - POST
        plugins:
          - name: jwt

      # POST /api/ventas            — crear venta (con JWT)
      # POST /api/ventas/{id}/items — agregar ítems a una venta (con JWT)
      # El prefijo /api/ventas captura ambos sub-paths.
      - name: ventas-route
        paths:
          - /api/ventas
        strip_path: false
        methods:
          - POST
        plugins:
          - name: jwt

# ==============================================================================
# Plugins Globales
# ==============================================================================
# ==============================================================================

plugins:
  # Expone métricas en /metrics (puerto admin 8001) para que Prometheus
  # pueda scrapearlas — requerido por el job "kong" ya definido en prometheus.yml
  - name: prometheus

  # Rate limiting global: máximo 100 requests por minuto por IP
  - name: rate-limiting
    config:
      minute: 100
      policy: local
      fault_tolerant: true
      hide_client_headers: false

  # CORS para permitir requests desde Electron en desarrollo
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        - PATCH
      headers:
        - Accept
        - Authorization
        - Content-Type
        - Origin
        - X-Requested-With
        - X-Tenant-Id
      exposed_headers:
        - X-Auth-Token
        - X-RateLimit-Remaining
      credentials: true
      max_age: 3600