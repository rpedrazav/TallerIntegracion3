# ==============================================================================
# Configuración Declarativa de Kong API Gateway (DB-less Mode)
# Proyecto: GlobalMart OS (INTEGRA3)
# Tarea: TI3-113
#
# Este archivo define todas las rutas, servicios y plugins de Kong.
# Kong lo carga al arrancar via KONG_DECLARATIVE_CONFIG.
#
# Documentación: https://docs.konghq.com/gateway/3.6.x/production/deployment-topologies/db-less-and-declarative-config/
# ==============================================================================

_format_version: "3.0"
_transform: true

# ==============================================================================
# Servicios y Rutas — Sprint 1
# ==============================================================================
# NOTA (S3-029): los microservicios corren en el host con `run-apis.bat` /
# `run-apis.sh` (dotnet run), no en docker compose. Kong los alcanza vía
# `host.docker.internal` (extra_hosts en docker-compose.yml) en los puertos de
# launchSettings.json. Este archivo solo lo usa docker compose; el clúster usa
# sus propios manifiestos (k8s/manifests) e Ingress, sin Kong.
# ==============================================================================

services:

  # --------------------------------------------------------------------------
  # MS-1: Tenant & Identity Service (host :5124)
  # --------------------------------------------------------------------------
  - name: tenant-identity-service
    url: http://host.docker.internal:5124
    routes:
      # Ruta pública: solo POST /api/auth/login (no requiere JWT)
      - name: auth-login-route
        paths:
          - /api/auth/login
        strip_path: false
        methods:
          - POST
          - OPTIONS

      # Rutas protegidas de auth (GET, PUT, DELETE — requieren JWT)
      - name: auth-route
        paths:
          - /api/auth
        strip_path: false
        methods:
          - GET
          - PUT
          - DELETE
          - OPTIONS
        plugins:
          - name: jwt

      - name: users-route
        paths:
          - /api/users
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        plugins:
          - name: jwt

      - name: tenants-route
        paths:
          - /api/tenants
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        plugins:
          - name: jwt

      - name: sucursales-route
        paths:
          - /api/sucursales
        strip_path: false
        methods:
          - GET
          - POST
          - OPTIONS
        plugins:
          - name: jwt

  # --------------------------------------------------------------------------
  # MS-3: Catalog & Pricing Service (host :5203)
  # --------------------------------------------------------------------------
  - name: catalog-pricing-service
    url: http://host.docker.internal:5203
    routes:
      - name: products-route
        paths:
          - /api/products
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        plugins:
          - name: jwt

      - name: categories-route
        paths:
          - /api/categories
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        plugins:
          - name: jwt

      - name: prices-route
        paths:
          - /api/prices
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        plugins:
          - name: jwt

      - name: promotions-route
        paths:
          - /api/promotions
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        plugins:
          - name: jwt

  # --------------------------------------------------------------------------
  # MS-4: Warehouse & Inventory Service (host :5205)
  # --------------------------------------------------------------------------
  - name: warehouse-inventory-service
    url: http://host.docker.internal:5205
    routes:
      - name: stock-route
        paths:
          - /api/stock
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        plugins:
          - name: jwt

  # --------------------------------------------------------------------------
  # MS-5: POS & Cart Service (host :5000, default de dotnet run)
  # --------------------------------------------------------------------------
  - name: pos-cart-service
    url: http://host.docker.internal:5000
    routes:
      - name: turnos-route
        paths:
          - /api/turnos
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        plugins:
          - name: jwt

      - name: ventas-route
        paths:
          - /api/ventas
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        plugins:
          - name: jwt

  # --------------------------------------------------------------------------
  # Payment Gateway Simulator (TI3-688 / S2-057, TI3-689 / S2-058)
  # --------------------------------------------------------------------------
  - name: payment-simulator-service
    url: http://host.docker.internal:5050
    routes:
      - name: simulator-payments-route
        paths:
          - /simulator/payments
          - /api/simulator/payments
          - /simulator/reversals
          - /api/simulator/reversals
        strip_path: false
        methods:
          - GET
          - POST
          - OPTIONS

      - name: simulator-health-route
        paths:
          - /simulator/health
          - /api/simulator/health
        strip_path: false
        methods:
          - GET
          - OPTIONS

# ==============================================================================
# Consumer JWT de desarrollo (S3-029)
# ==============================================================================
# El plugin `jwt` busca el consumer cuyo `key` coincide con el claim `iss`.
# MS-1 firma HS256 con `iss: GlobalMartOS` y la clave Jwt:Key de
# src/TenantIdentityService/appsettings.json. Si cambia esa clave, actualizar aquí.
# Solo para desarrollo local: no es un secreto de producción.
# ==============================================================================

consumers:
  - username: globalmart-dev
    jwt_secrets:
      - key: GlobalMartOS
        algorithm: HS256
        secret: "GlobalMartOS_SuperSecretKey_ChangeInProduction_Min32Chars!!"

# ==============================================================================
# Plugins Globales
# ==============================================================================

plugins:
  # Rate limiting global: máximo 100 requests por minuto por IP
  - name: rate-limiting
    config:
      minute: 100
      policy: local
      fault_tolerant: true
      hide_client_headers: false

  # CORS para permitir requests desde Electron en desarrollo
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        - PATCH
      headers:
        - Accept
        - Authorization
        - Content-Type
        - Origin
        - X-Requested-With
        - X-Tenant-Id
      exposed_headers:
        - X-Auth-Token
        - X-RateLimit-Remaining
      credentials: true
      max_age: 3600
