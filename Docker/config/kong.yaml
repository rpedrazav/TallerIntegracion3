_format_version: "3.0"
_transform: true

# ==============================================================================
# Consumidor Emisor JWT (RN-07)
# Sincronizado con Jwt:Issuer="GlobalMartOS" y Jwt:Key de desarrollo en MS-1..MS-5
# ==============================================================================
consumers:
  - username: globalmart-jwt-issuer
    jwt_secrets:
      - key: "GlobalMartOS"
        algorithm: HS256
        secret: "GlobalMartOS_SuperSecretKey_ChangeInProduction_Min32Chars!!"

# ==============================================================================
# Servicios y Rutas — Sprint 2 (Flujo Crítico Verificado)
# NOTA (S3-029): los microservicios corren en el host con run-apis (dotnet run),
# no en docker compose. Kong los alcanza vía host.docker.internal en los puertos
# de launchSettings.json.
# ==============================================================================
services:

  # --------------------------------------------------------------------------
  # MS-1: Tenant & Identity Service (Host :5124)
  # --------------------------------------------------------------------------
  - name: tenant-identity-service
    url: http://host.docker.internal:5124
    routes:
      # Ruta pública: solo POST /api/auth/login (no requiere JWT)
      - name: auth-login-route
        paths:
          - /api/auth/login
        strip_path: false
        methods:
          - POST
          - OPTIONS

      # Rutas protegidas: requieren JWT válido con claim de tenant
      - name: auth-protected-route
        paths:
          - /api/auth/me
          - /api/auth/refresh
          - /api/auth/logout
        strip_path: false
        methods:
          - GET
          - POST
          - OPTIONS
        plugins:
          - name: jwt

      - name: tenants-route
        paths:
          - /api/tenants
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        plugins:
          - name: jwt

      - name: users-route
        paths:
          - /api/users
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        plugins:
          - name: jwt

      - name: sucursales-route
        paths:
          - /api/sucursales
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        plugins:
          - name: jwt

      - name: roles-route
        paths:
          - /api/roles
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        plugins:
          - name: jwt

  # --------------------------------------------------------------------------
  # MS-2: Tax & Compliance Service (Host :5239)
  # --------------------------------------------------------------------------
  - name: tax-compliance-service
    url: http://host.docker.internal:5239
    routes:
      - name: tax-route
        paths:
          - /api/tax
        strip_path: false
        methods:
          - POST
          - OPTIONS
        plugins:
          - name: jwt

      - name: comprobantes-route
        paths:
          - /api/comprobantes
        strip_path: false
        methods:
          - GET
          - POST
          - OPTIONS
        plugins:
          - name: jwt

  # --------------------------------------------------------------------------
  # MS-3: Catalog & Pricing Service (Host :5203)
  # --------------------------------------------------------------------------
  - name: catalog-pricing-service
    url: http://host.docker.internal:5203
    routes:
      - name: catalog-route
        paths:
          - /api/products
          - /api/catalog
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        plugins:
          - name: jwt

      - name: precios-route
        paths:
          - /api/precios
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        plugins:
          - name: jwt

      - name: categorias-route
        paths:
          - /api/categorias
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        plugins:
          - name: jwt

      - name: catalog-seed-route
        paths:
          - /seed
        strip_path: false
        methods:
          - POST
          - OPTIONS
        plugins:
          - name: jwt

  # --------------------------------------------------------------------------
  # MS-4: Warehouse & Inventory Service (Host :5205)
  # --------------------------------------------------------------------------
  - name: warehouse-inventory-service
    url: http://host.docker.internal:5205
    routes:
      - name: stock-route
        paths:
          - /api/stock
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        plugins:
          - name: jwt

      - name: recepciones-route
        paths:
          - /api/recepciones
        strip_path: false
        methods:
          - POST
          - OPTIONS
        plugins:
          - name: jwt

  # --------------------------------------------------------------------------
  # MS-5: POS & Cart Service (Host :5000)
  # --------------------------------------------------------------------------
  - name: pos-cart-service
    url: http://host.docker.internal:5000
    routes:
      - name: turnos-route
        paths:
          - /api/turnos
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        plugins:
          - name: jwt

      - name: ventas-route
        paths:
          - /api/ventas
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        plugins:
          - name: jwt

  # --------------------------------------------------------------------------
  # Payment Gateway Simulator (TI3-688 / S2-057, TI3-689 / S2-058)
  # --------------------------------------------------------------------------
  - name: payment-simulator-service
    url: http://host.docker.internal:5050
    routes:
      - name: simulator-payments-route
        paths:
          - /simulator/payments
          - /api/simulator/payments
          - /simulator/reversals
          - /api/simulator/reversals
        strip_path: false
        methods:
          - GET
          - POST
          - OPTIONS

      - name: simulator-health-route
        paths:
          - /simulator/health
          - /api/simulator/health
        strip_path: false
        methods:
          - GET
          - OPTIONS

# ==============================================================================
# Plugins Globales
# ==============================================================================

plugins:
  # Rate limiting global: máximo 100 requests por minuto por IP
  - name: rate-limiting
    config:
      minute: 100
      policy: local
      fault_tolerant: true
      hide_client_headers: false

  # CORS para permitir requests desde Electron en desarrollo
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        - PATCH
      headers:
        - Accept
        - Authorization
        - Content-Type
        - Idempotency-Key
        - Origin
        - X-Requested-With
        - X-Tenant-Id
      exposed_headers:
        - X-Auth-Token
        - X-RateLimit-Remaining
      credentials: true
      max_age: 3600
