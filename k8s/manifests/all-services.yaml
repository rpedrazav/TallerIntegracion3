apiVersion: v1
kind: Service
metadata:
  name: postgres-tenantidentityservice
spec:
  ports:
  - port: 5432
  selector:
    app: postgres-tenantidentityservice
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-tenantidentityservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-tenantidentityservice
  template:
    metadata:
      labels:
        app: postgres-tenantidentityservice
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "postgres"
        - name: POSTGRES_DB
          value: "tenant_db"
        resources:
          requests:
            cpu: "25m"
            memory: "64Mi"
          limits:
            cpu: "50m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: tenantidentityservice
spec:
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: tenantidentityservice
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenantidentityservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tenantidentityservice
  template:
    metadata:
      labels:
        app: tenantidentityservice
    spec:
      containers:
      - name: tenantidentityservice
        image: rpedrazav/tenantidentityservice:latest
        imagePullPolicy: Always
        env:
        - name: ConnectionStrings__DefaultConnection
          value: "Host=postgres-tenantidentityservice;Database=tenant_db;Username=postgres;Password=postgres"
        - name: ASPNETCORE_HTTP_PORTS
          value: "8080"
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "25m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
---
