# Requiere Secret globalmart-warehouse-config en student-rpedraza con las claves
# connection-string, jwt-key y kafka-bootstrap-servers. jwt-key debe coincidir
# con MS-1. warehouse_db es una base independiente en el PostgreSQL existente
# del POS: el clúster no permite crear otro PVC ni otro Service en el namespace.
apiVersion: v1
kind: Service
metadata:
  name: warehouseinventoryservice
  namespace: student-rpedraza
spec:
  selector:
    app: warehouseinventoryservice
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: warehouseinventoryservice
  namespace: student-rpedraza
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: warehouseinventoryservice
  template:
    metadata:
      labels:
        app: warehouseinventoryservice
    spec:
      containers:
        - name: warehouseinventoryservice
          image: rpedrazav/warehouseinventoryservice:admin-20261027-2
          imagePullPolicy: Always
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: globalmart-warehouse-config
                  key: connection-string
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: globalmart-warehouse-config
                  key: jwt-key
            - name: Kafka__BootstrapServers
              valueFrom:
                secretKeyRef:
                  name: globalmart-warehouse-config
                  key: kafka-bootstrap-servers
            - name: Kafka__Enabled
              value: "false"
            - name: Services__CatalogUrl
              value: http://catalogpricingservice
            - name: Services__IdentityUrl
              value: http://tenantidentityservice
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inventory-ingress
  namespace: student-rpedraza
  annotations:
    external-dns.alpha.kubernetes.io/target: proxy.inf.uct.cl
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - inventory-rpedraza.dev.censei.cl
      secretName: globalmart-dev-tls
  rules:
    - host: inventory-rpedraza.dev.censei.cl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: warehouseinventoryservice
                port:
                  number: 80
