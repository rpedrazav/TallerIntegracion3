name: Build and Push Docker Images

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Iniciar sesión en Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Construir y Subir TenantIdentityService
      uses: docker/build-push-action@v5
      with:
        context: ./src/TenantIdentityService
        file: ./src/TenantIdentityService/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/tenantidentityservice:latest

    - name: Construir y Subir TaxComplianceService
      uses: docker/build-push-action@v5
      with:
        context: ./src/TaxComplianceService
        file: ./src/TaxComplianceService/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/taxcomplianceservice:latest

    - name: Construir y Subir CatalogPricingService
      uses: docker/build-push-action@v5
      with:
        context: ./src/CatalogPricingService
        file: ./src/CatalogPricingService/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/catalogpricingservice:latest

    - name: Construir y Subir POSCartService
      uses: docker/build-push-action@v5
      with:
        context: ./src/POSCartService
        file: ./src/POSCartService/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/poscartservice:latest
